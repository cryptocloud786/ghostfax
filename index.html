<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#000000" />
  <title>GHOSTFAX — Teletext, risen from the grave</title>
  <link rel="manifest" href="manifest.json" />
  <link rel="stylesheet" href="styles/ghostfax.css" />
</head>
<body>
  <!-- off-screen accessibility mirror -->
  <div id="aria-mirror" aria-live="polite" aria-atomic="true" class="sr-only"></div>

  <main id="tv">
    <div id="screen">
      <!-- 40×24 teletext grid, populated by renderer.js -->
      <div id="grid" role="document" aria-label="Teletext page"></div>
    </div>

    <!-- on-screen remote control -->
    <nav id="remote" aria-label="Remote control">
      <div id="fastext-bar">
        <button class="fastext-btn" id="btn-red"    data-key="F1" aria-label="Red — navigate"></button>
        <button class="fastext-btn" id="btn-green"  data-key="F2" aria-label="Green — navigate"></button>
        <button class="fastext-btn" id="btn-yellow" data-key="F3" aria-label="Yellow — navigate"></button>
        <button class="fastext-btn" id="btn-cyan"   data-key="F4" aria-label="Cyan — navigate"></button>
      </div>
      <div id="numpad">
        <button class="num-btn" data-digit="1">1</button>
        <button class="num-btn" data-digit="2">2</button>
        <button class="num-btn" data-digit="3">3</button>
        <button class="num-btn" data-digit="4">4</button>
        <button class="num-btn" data-digit="5">5</button>
        <button class="num-btn" data-digit="6">6</button>
        <button class="num-btn" data-digit="7">7</button>
        <button class="num-btn" data-digit="8">8</button>
        <button class="num-btn" data-digit="9">9</button>
        <button class="num-btn" id="btn-backspace" aria-label="Backspace">←</button>
        <button class="num-btn" data-digit="0">0</button>
        <button class="num-btn" id="btn-enter" aria-label="Enter">↵</button>
      </div>
      <div id="ctrl-bar">
        <button id="btn-hold"   aria-label="Hold page (H)">HOLD</button>
        <button id="btn-reveal" aria-label="Reveal hidden text (R)">REVEAL</button>
        <button id="btn-exorcise" aria-label="Toggle CRT effects">EXORCISE</button>
        <button id="btn-index"  aria-label="Go to index page 100">INDEX</button>
      </div>
    </nav>
  </main>

  <script type="module" src="src/ui/accessibility.js"></script>
  <script type="module" src="src/ui/renderer.js"></script>
  <script type="module" src="src/ui/clock.js"></script>
  <script type="module" src="src/ui/keypad.js"></script>
</body>
</html>
